<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegIT Assist - Ticket Submitted</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .mobile-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 95vh;
            box-sizing: border-box;
        }
        .success-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h2 {
            color: #16a34a;
            margin: 0 0 8px 0;
            font-size: 18px;
        }
        p {
            color: #64748b;
            font-size: 12px;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .ticket-id-box {
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            color: #334155;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .home-btn {
            background: #0284c7;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
        }
        .home-btn:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="success-icon">✅</div>
    <h2>Ticket Submitted Successfully!</h2>
    <p>Your problem report has been routed straight to the IT Admin queue for review and assignment.</p>
    
    <div class="ticket-id-box">
        Ticket ID: #REG-9084
    </div>

    <a href="{% url 'report_problem' %}" class="home-btn">Report Another Problem</a>
</div>

</body>
</html>
